name: CI & Deploy

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Laravel 12 exige PHP >= 8.2 (voir composer.json).
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, bcmath, pdo_mysql, pdo_sqlite, zip, gd
          ini-values: post_max_size=256M, upload_max_filesize=256M
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: ./vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

      - name: Audit PHP dependencies
        run: composer audit --abandoned=ignore

      # Le déploiement récupère cet artefact au lieu de recompiler sur le
      # serveur : on livre exactement les assets qui viennent d'être testés,
      # et la production n'a pas besoin de Node.
      - name: Keep the compiled assets for the deploy job
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_PRODUCTION_DEPLOY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: public-build
          path: public/build
          retention-days: 1
          if-no-files-found: error

  # L'image se construisait "avec succès" alors que composer install échouait,
  # masqué par un || true. Ce job la construit pour de bon et vérifie que ce
  # que ce masquage cachait est bien présent.
  docker:
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t sen-recrutement:ci .

      - name: Verify the image boots and is complete
        run: |
          docker run --rm \
            -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            sen-recrutement:ci \
            sh -c '
              set -e
              php artisan --version
              test -d public/build
              test -L public/storage
              test -f vendor/autoload.php
            '

      # Le dépôt est monté par-dessus /var/www/html, et vendor comme
      # public/build sont gitignorés donc absents du checkout. C'est
      # exactement le cas que les volumes nommés doivent couvrir.
      - name: Verify the local compose stack boots
        run: |
          docker compose up -d
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/up > /dev/null; then
              echo "L'application répond sur /up"
              docker compose down -v
              exit 0
            fi
            sleep 5
          done
          echo "L'application n'a jamais répondu."
          docker compose ps
          docker compose logs --no-color
          exit 1

  deploy:
    needs: [build, docker, docker-dev]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the assets built and tested by the build job
        uses: actions/download-artifact@v4
        with:
          name: public-build
          path: public/build

      # public/build est gitignoré, donc le git reset du script ci-dessous ne
      # le touche pas : l'ordre entre l'envoi et le déploiement est sans effet.
      - name: Upload the assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: public/build/*
          target: /var/www/your_project/public/build
          strip_components: 2
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          # Pas de npm ici : les assets arrivent compilés depuis la CI. Les
          # compiler sur place imposerait Node en production et, avec set -e,
          # une absence de Node couperait le déploiement après le git reset et
          # les migrations, laissant le serveur à moitié à jour.
          script: |
            set -e
            cd /var/www/your_project || exit 1
            git fetch --all
            git reset --hard origin/main
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link
            sudo systemctl reload nginx

  docker-dev:
    name: Docker local et publication dev
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    concurrency:
      group: docker-dev-${{ github.ref }}
      cancel-in-progress: true
    env:
      COMPOSE_FILE: deploy/dev-local/compose.yaml
      DEV_IMAGE: sen-recrutement-dev:ci
      SEN_RECRUTEMENT_APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Construire et démarrer les conteneurs
        run: docker compose up --build --wait --wait-timeout 180

      - name: Vérifier l’application via le port local
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8093/ -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8093/login -o /tmp/login.html
          grep -q 'name="_token"' /tmp/login.html
          docker compose exec -T app php artisan migrate:status --no-ansi

      - name: Journaux du démarrage
        if: failure()
        run: docker compose logs --no-color

      - name: Arrêter la pile de test
        if: always()
        run: docker compose down --volumes

      - name: Publier les images validées sur GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          image="$registry/sen-recrutement-dev"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

          docker tag "$DEV_IMAGE" "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_SHA"
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq .object.sha)" = "$GITHUB_SHA" ]; then
            docker tag "$image:$GITHUB_SHA" "$image:dev"
            docker push "$image:dev"
          fi
