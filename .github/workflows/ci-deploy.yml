name: CI & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Laravel 12 exige PHP >= 8.2 (voir composer.json).
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, bcmath, pdo_mysql, pdo_sqlite, zip, gd
          ini-values: post_max_size=256M, upload_max_filesize=256M
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: ./vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

      - name: Audit PHP dependencies
        run: composer audit --abandoned=ignore

  # L'image se construisait "avec succès" alors que composer install échouait,
  # masqué par un || true. Ce job la construit pour de bon et vérifie que ce
  # que ce masquage cachait est bien présent.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t sen-recrutement:ci .

      - name: Verify the image boots and is complete
        run: |
          docker run --rm \
            -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            sen-recrutement:ci \
            sh -c '
              set -e
              php artisan --version
              test -d public/build
              test -L public/storage
              test -f vendor/autoload.php
            '

      # Le dépôt est monté par-dessus /var/www/html, et vendor comme
      # public/build sont gitignorés donc absents du checkout. C'est
      # exactement le cas que les volumes nommés doivent couvrir.
      - name: Verify the local compose stack boots
        run: |
          docker compose up -d
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/up > /dev/null; then
              echo "L'application répond sur /up"
              docker compose down -v
              exit 0
            fi
            sleep 5
          done
          echo "L'application n'a jamais répondu."
          docker compose ps
          docker compose logs --no-color
          exit 1

  deploy:
    needs: [build, docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            cd /var/www/your_project || exit 1
            git fetch --all
            git reset --hard origin/main
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            npm ci
            npm run build
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link
            sudo systemctl reload nginx
